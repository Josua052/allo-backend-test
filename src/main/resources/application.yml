server:
  port: 4110
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  jackson:
    default-property-inclusion: non_null

  application:
    name: splitbill

  datasource:
    # Use environment variables for sensitive data, fallback to local defaults
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:splitbill_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Use update for dev, use validate in production
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  github:
    username: Josua052

version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: splitbill-postgres
    restart: always
    environment:
      POSTGRES_DB: splitbill_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Service (Spring Boot)
  backend:
    build: .
    container_name: splitbill-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4110:4110"
    environment:
      # Docker Compose network override (points to the 'db' container)
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: splitbill_db
      DB_USER: postgres
      DB_PASSWORD: postgres

volumes:
  postgres-data:
